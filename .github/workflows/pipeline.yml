name: Wellness Tourism MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  register-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Register source dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID || 'sprd12/Great_Learning' }}
        run: python scripts/register_data.py

  prepare-data:
    needs: register-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Prepare and upload train/test data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO_ID: ${{ vars.HF_DATASET_REPO_ID || 'sprd12/Great_Learning' }}
        run: python scripts/prepare_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/processed/

  train-register:
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/processed

      - name: Train, evaluate, and register model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO_ID: ${{ vars.HF_MODEL_REPO_ID || 'sprd12/RandomForest' }}
          MLFLOW_ALLOW_FILE_STORE: "true"
        run: |
          PYTHONPATH=. python scripts/train_model.py

      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

  deploy-space:
    needs: train-register
    if: ${{ vars.HF_SPACE_REPO_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub
      - name: Push Streamlit application to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
        run: python scripts/deploy_space.py